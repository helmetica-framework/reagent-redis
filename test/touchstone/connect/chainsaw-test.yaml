apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: connect
spec:
  description: >-
    End to End tests the connection to Redis with auth.
    Same basic setup as the install test.
  steps:
    - name: claim an instance and check its workload
      use:
        template: ../shared/claim.yaml

    # Runs in the test's own namespace. The template's bindings do not reach this
    # step, so the Secret custos wrote is found by its label; the template already
    # asserted its name.
    - name: connect with a client
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE get secret \
                -l custos.helmetica.io/credentialconfig-name=credentials \
                -o jsonpath='{.items[0].metadata.name}'
            outputs:
              - name: secret
                value: ($stdout)
        - apply:
            file: client.yaml
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: redis-client
              status:
                succeeded: 1
      catch:
        - describe:
            apiVersion: custos.helmetica.io/v1
            kind: CredentialConfig
        - describe:
            apiVersion: sigillum.helmetica.io/v1
            kind: NetworkConfig
        - describe:
            apiVersion: batch/v1
            kind: Job
        - podLogs:
            selector: job-name=redis-client
            tail: 50
