apiVersion: (join('', ['v', $major, '-', $id, '.', $chart, '.helmetica-bundles.io/bundle']))
kind: ($kind)
metadata:
  name: instance
spec:
  approval:
    strategy: Automatic
  version: ($version)
  values:
    # Nothing to back up here, and a bucket per test run is a cost this one does not need.
    backup:
      enabled: false
    service:
      # A plan other than the default, so the run proves the cel: arithmetic against a real
      # chrysopoeia rather than only the default it would fall back to. The claim namespace
      # is allowed through the Seal implicitly, so nothing has to be opened up.
      plan: standard-2
      storage: 1Gi
      # A setting the chart does not compute, to prove the merge keeps both sides. maxmemory
      # is set too, and must lose: it is computed from the plan.
      config:
        maxmemory-policy: allkeys-lru
        maxmemory: 99gb
