# How this service is backed up. The backup controller reads these off the instance; the
# framework itself knows nothing about backups.
backup:
  # Whether the service is backed up at all.
  enabled: true

  # Who takes the backups.
  #   Schedule   - the backup controller provisions a bucket and drives k8up over the
  #                service's volumes.
  #   BucketOnly - it provisions the bucket and stops there, for a service whose own
  #                operator writes backups to object storage (CloudNativePG, MariaDB).
  '#mode':
    type: string
    enum: [Schedule, BucketOnly]
  mode: Schedule

  # When each job runs, as a cron expression or a k8up shortcut like `@daily-random`.
  # Only used with mode Schedule.
  #
  # An empty backup gets a nightly time between 22:00 and 06:00, generated from the name
  # of the instance so that it stays put across upgrades and no two instances start in the
  # same minute. Empty prune and check take the backup controller's default, which runs
  # them weekly.
  schedule:
    backup: ""
    prune: ""
    check: ""

  # The COSI classes the bucket is provisioned from. Empty takes the backup controller's
  # default, which is how a cluster keeps all its backups in one place.
  bucketClassName: ""
  bucketAccessClassName: ""

  # How many backups survive a prune. All zero takes the backup controller's default
  # retention. Only used with mode Schedule.
  retention:
    keepLast: 0
    keepHourly: 0
    keepDaily: 0
    keepWeekly: 0
    keepMonthly: 0
    keepYearly: 0

network:
  # A list of allowed namespaces. The namespace where the claim resides is
  # always included implicitly.
  '#allowedNamespaces':
    items:
      '#':
        type: string
  allowedNamespaces: []

  # Allow access from all namespaces.
  allowAllNamespaces: false

credentials:
  # Secret name which will contain the service's connection details.
  # Defaults to releaseName-credentials.
  targetSecret: ""

service:
  # The size of the instance. The number is gibibytes of memory the pod may use, and cpu
  # follows it at 250 millicores per gibibyte. Requests are set equal to the limits, so the
  # pod is Guaranteed.
  '#plan':
    type: string
    enum: [standard-1, standard-2, standard-4, standard-8]
  plan: standard-1

  # How many replicas of Redis should be running.
  # 1 is a single instance
  # 3 is for a replication cluster with Sentinel
  '#replicas':
    type: integer
    enum: [1,3]
  replicas: 1

  # The size of the data volume. Unrelated to the plan: a dataset that fits in memory still
  # needs room on disk for the append only file and the snapshots beside it.
  storage: 10Gi

  # redis.conf entries.
  # maxmemory and min-replicas-to-write are computed from the plan and the replica count, and
  # win over anything set here. Values are strings, so a number needs quoting.
  '#config':
    items:
      '#':
        type: string
  config: {}

'#redis':
  export: false
redis:
  replicas: "cel: values.service.replicas"

  fullnameOverride: redis

  auth: true
  existingSecret: '{{ .Release.Name }}-auth'
  authKey: auth

  rbac:
    create: true

  hardAntiAffinity: true

  podDisruptionBudget:
    maxUnavailable: 1

  haproxy:
    enabled: "cel: values.service.replicas > 1"

  exporter:
    enabled: true
    serviceMonitor:
      enabled: false

  persistentVolume:
    size: "cel: values.service.storage"
    annotations:
      k8up.io/backup: '"false"'

  extraVolumes:
    - name: backup-script
      configMap:
        name: backup

  sentinel:
    quorum: "cel: values.service.replicas > 1 ? 2 : 1"
    config:
      down-after-milliseconds: 3000
      failover-timeout: 5000

  redis:
    config: >-
      cel: cel.bind(computed, {'maxmemory': cel.bind(n, int(values.service.plan.split('-')[1]), string(n * 768) + 'mb'),
      'min-replicas-to-write': values.service.replicas > 1 ? 1 : 0},
      (values.service.config.map(k, k) + computed.map(k, k)).distinct()
      .transformMapEntry(i, k, {k: k in computed ? computed[k] : values.service.config[k]}))

    # Requests equal limits, so the pod is Guaranteed.
    resources:
      requests:
        cpu: "cel: cel.bind(n, int(values.service.plan.split('-')[1]), string(n * 250) + 'm')"
        memory: "cel: cel.bind(n, int(values.service.plan.split('-')[1]), string(n) + 'Gi')"
      limits:
        cpu: "cel: cel.bind(n, int(values.service.plan.split('-')[1]), string(n * 250) + 'm')"
        memory: "cel: cel.bind(n, int(values.service.plan.split('-')[1]), string(n) + 'Gi')"

    startupProbe:
      # About 30 minutes, should be enough for the largest instances.
      failureThreshold: 120

    podAnnotations:
      k8up.io/backupcommand: sh /scripts/backup.sh
      k8up.io/file-extension: .tar

    extraVolumeMounts:
      - name: backup-script
        mountPath: /scripts
