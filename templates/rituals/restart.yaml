apiVersion: rituals.helmetica.io/v1
kind: Definition
metadata:
  name: restart
  labels:
    {{- include "azoth.labels" . | nindent 4 }}
spec:
  description: Restart the application
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: restart
              # renovate: datasource=docker depName=registry.k8s.io/kubectl
              image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
              command: ["kubectl"]
              args: ["rollout", "restart", "statefulset/{{ .Values.redis.fullnameOverride }}-server"]
          restartPolicy: Never
