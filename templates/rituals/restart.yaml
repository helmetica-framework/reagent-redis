apiVersion: adept.helmetica.io/v1
kind: Definition
metadata:
  name: restart
  labels:
    {{- include "azoth.labels" . | nindent 4 }}
spec:
  description: Restart the application
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: restart
              # renovate: datasource=docker depName=registry.k8s.io/kubectl
              image: registry.k8s.io/kubectl:v1.37.3@sha256:82f06779a0dcd86225ffdb96c005418b9716093a39907a5ecf686d7a22e6b788
              command: ["kubectl"]
              args: ["rollout", "restart", "statefulset/{{ .Values.redis.fullnameOverride }}-server"]
          restartPolicy: Never
