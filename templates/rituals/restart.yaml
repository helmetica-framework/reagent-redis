apiVersion: rituals.helmetica.io/v1
kind: Definition
metadata:
  name: restart
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  description: Restart the application
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: restart
              # renovate: datasource=docker depName=registry.k8s.io/kubectl
              image: registry.k8s.io/kubectl:v1.34.1
              command: ["kubectl"]
              args: ["rollout", "restart", "statefulset/{{ .Values.service.fullnameOverride }}-server"]
          restartPolicy: Never
