apiVersion: rituals.helmetica.io/v1
kind: Definition
metadata:
  name: restart
  labels:
    {{- include "azoth.labels" . | nindent 4 }}
spec:
  description: Restart the application
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: restart
              # renovate: datasource=docker depName=registry.k8s.io/kubectl
              image: registry.k8s.io/kubectl:v1.37.2@sha256:fe049faa65ae483ac200009a949a68fa4c9985daea12c9cb1195c9c7965301fc
              command: ["kubectl"]
              args: ["rollout", "restart", "statefulset/{{ .Values.redis.fullnameOverride }}-server"]
          restartPolicy: Never
