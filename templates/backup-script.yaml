apiVersion: v1
kind: ConfigMap
metadata:
  name: backup
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  # Works with the append only file both on and off: it makes sure no rewrite is running
  # while the backup reads /data. If there is a dump file it is picked up along with it.
  #
  # Run as `sh backup.sh`, so the shebang is only there for anyone who runs it by hand.
  backup.sh: |
    #!/bin/sh

    REDIS_PASSWORD=$AUTH

    redis_cmd() {
      redis-cli -a "${REDIS_PASSWORD}" "$@"
    }

    rewrite_percentage=$(redis_cmd --raw CONFIG GET auto-aof-rewrite-percentage | tail -n 1) 1>&2

    redis_cmd CONFIG SET auto-aof-rewrite-percentage 0 1>&2

    redis_cmd SAVE 1>&2

    until redis_cmd INFO persistence | grep aof_rewrite_in_progress:0 > /dev/null
    do
      sleep 1
    done

    tar -cf - /data

    redis_cmd CONFIG SET auto-aof-rewrite-percentage "${rewrite_percentage}" 1>&2
