{{- $name := printf "%s-auth" .Release.Name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $password := (get (get $existing "data" | default dict) "auth" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
type: Opaque
data:
  auth: {{ $password | b64enc | quote }}
