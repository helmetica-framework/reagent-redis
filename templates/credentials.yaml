{{/*
  The connection details this service hands out. Arcana resolves every entry and writes the
  results into one secret in the instance namespace; the framework itself never reads the
  values.

  The expressions below are arcana's own templating, resolved by the controller against the
  credentials that resolved before them. They are wrapped in backticks so helm passes them
  through untouched instead of evaluating them at render time. ClaimName, ClaimNamespace,
  ClaimKind, ClaimAPIVersion, InstanceNamespace and ArcanumName are reserved and always in
  scope.
*/}}
{{/*
  Which endpoint the credentials point at. With haproxy in front that is the proxy, which
  always forwards to the current master. Without it the only thing left to hand out is the
  headless service, whose record covers the replicas too.
*/}}
{{- $service := .Values.service.fullnameOverride }}
{{- $port := .Values.service.redis.port | default 6379 }}
{{- if .Values.service.haproxy.enabled }}
{{- $service = printf "%s-haproxy" $service }}
{{- $port = .Values.service.haproxy.servicePort | default 6379 }}
{{- end }}
apiVersion: arcana.helmetica.io/v1
kind: Arcanum
metadata:
  name: credentials
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  target:
    name: {{ .Values.credentials.targetSecret | default (printf "%s-credentials" .Release.Name) | quote }}
  credentials:
    valueMapping:
      REDIS_HOST:
        source: template
        value: {{ printf "%s.{{.InstanceNamespace}}.svc.cluster.local" $service | quote }}
      REDIS_PORT:
        source: const
        value: {{ $port | quote }}
      REDIS_USERNAME:
        source: const
        value: "default"
      REDIS_PASSWORD:
        source: objectRef
        kind: Secret
        name: {{ printf "%s-auth" .Release.Name | quote }}
        key: {{ .Values.service.authKey | quote }}
      REDIS_URL:
        source: template
        value: {{ `redis://{{.REDIS_USERNAME}}:{{.REDIS_PASSWORD}}@{{.REDIS_HOST}}:{{.REDIS_PORT}}` | quote }}
      {{- /*
        Only for replica 3!
      */}}
      {{- if gt (int .Values.service.replicas) 1 }}
      REDIS_SENTINEL_HOST:
        source: template
        value: {{ printf "%s.{{.InstanceNamespace}}.svc.cluster.local" .Values.service.fullnameOverride | quote }}
      REDIS_SENTINEL_PORT:
        source: const
        value: {{ .Values.service.sentinel.port | default 26379 | quote }}
      REDIS_MASTER_GROUP_NAME:
        source: const
        value: {{ .Values.service.redis.masterGroupName | default "mymaster" | quote }}
      {{- end }}
