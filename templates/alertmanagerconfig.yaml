{{- $name := printf "%s-alerting" .Release.Name }}
apiVersion: monitoring.coreos.com/v1beta1
kind: AlertmanagerConfig
metadata:
  name: {{ $name }}
spec:
  receivers:
  - name: "null"
  - name: service_operator
    {{- if empty .Values.alerting.serviceOperator.emailAddresses | not }}
    emailConfigs:
    {{- range .Values.alerting.serviceOperator.emailAddresses }}
    - to: {{ . | quote }}
    {{- end }}
    {{- end }}
  route:
    groupBy:
    - alertname
    - audience
    groupInterval: 5s
    groupWait: 0s
    receiver: "null"
    repeatInterval: 4h
    routes:
    - matchers:
      - matchType: "="
        name: audience
        value: service_operator
      receiver: service_operator
