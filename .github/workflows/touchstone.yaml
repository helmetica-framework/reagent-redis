name: touchstone

on:
  pull_request:

permissions:
  contents: read

jobs:
  touchstone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Ignites athanor, runs `just touchstone` against it and dumps the
      # cluster state if it fails.
      - uses: helmetica-framework/athanor/.github/actions/touchstone@main
